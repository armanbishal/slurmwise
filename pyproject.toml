[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slurmwise"
version = "0.1.0"
description = "MCP server + LangGraph agent that diagnoses failed SLURM jobs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Md Arman Islam" }]
dependencies = [
    "mcp>=2.0",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "chromadb>=1.0",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
slurmwise = "slurmwise.cli:app"
slurmwise-mcp = "slurmwise.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["slurmwise*"]

[tool.setuptools.package-data]
slurmwise = ["knowledge/*.md", "benchmark/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]